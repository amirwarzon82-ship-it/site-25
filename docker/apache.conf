ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    AllowOverride All
    Require all granted
    Options -Indexes
    DirectoryIndex index.php

    # پشتیبان قوانین .htaccess (اگر آن فایل موقع آپلود جا بماند، سایت باز هم کار کند)
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteRule ^app/?$ student.html [L]
        RewriteRule ^(api|tg)/ index.php [L]
    </IfModule>

    <FilesMatch "^(config\.php|tgbot\.php|tg-setup\.php|tg-cron\.php|\.secret|.*\.json|.*\.lock|.*\.tmp)$">
        Require all denied
    </FilesMatch>
</Directory>
