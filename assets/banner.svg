<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Class Panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1546"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#22d3ee;#a78bfa;#f472b6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="card"><rect x="230" y="52" width="740" height="216" rx="30"/></clipPath>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="260" cy="90" r="90" fill="#22d3ee" opacity=".55">
      <animate attributeName="cx" values="260;420;260" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;200;90" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="230" r="100" fill="#f472b6" opacity=".45">
      <animate attributeName="cx" values="950;780;950" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;110;230" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="300" r="80" fill="#8b5cf6" opacity=".5">
      <animate attributeName="cx" values="600;700;500;600" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#fff">
    <circle cx="120" cy="260" r="3"><animate attributeName="cy" values="280;40" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="280" r="2.5"><animate attributeName="cy" values="300;30" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="150" r="2"><animate attributeName="cy" values="300;20" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="120" r="3"><animate attributeName="cy" values="310;20" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="230" y="52" width="740" height="216" rx="30" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22"/>
  <g clip-path="url(#card)">
    <rect x="-300" y="52" width="160" height="216" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1300" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="600" y="152" text-anchor="middle" font-family="Vazirmatn, Tahoma, 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="800" fill="url(#ttl)">پنل کلاس</text>
  <text x="600" y="203" text-anchor="middle" font-family="Vazirmatn, Tahoma, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#cbd5e1">حضور و غیاب · نمرات · کوییز · تکلیف · اپ اندروید</text>
  <g transform="translate(600 238)">
    <circle cx="-92" cy="0" r="6" fill="#34d399"><animate attributeName="r" values="5;9;5" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="-76" y="6" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="18" letter-spacing="2" fill="#a7f3d0">READY FOR RAILWAY</text>
  </g>
</svg>
